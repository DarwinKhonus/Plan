name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nastavit .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Obnovit závislosti
        run: dotnet restore Plan.sln

      - name: Sestavit
        run: dotnet build Plan.sln -c Release --no-restore

      - name: Spustit testy
        run: dotnet test Plan.Tests/Plan.Tests.csproj -c Release --no-build --verbosity normal

      # Instalátor se sestavuje i tady, aby se chyba ve skriptu projevila hned,
      # a ne až při vydávání verze, kdy je na to nejhorší chvíle.
      - name: Nainstalovat Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Publikovat pro instalátor
        run: >
          dotnet publish Plan/Plan.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Ověřit sestavení instalátoru
        shell: pwsh
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          /DAppVersion=0.0.0
          /DSourceExe=..\publish\Plan.exe
          installer\Plan.iss
