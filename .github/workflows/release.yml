name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Nastavit .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Odvodit verzi z tagu
        id: verze
        shell: pwsh
        run: |
          # refs/tags/v1.2.3 -> 1.2.3
          $verze = "${{ github.ref_name }}" -replace '^v', ''
          if ($verze -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag '${{ github.ref_name }}' neodpovídá formátu vX.Y.Z."
          }
          "verze=$verze" >> $env:GITHUB_OUTPUT
          Write-Host "Verze: $verze"

      - name: Obnovit závislosti
        run: dotnet restore Plan.sln

      - name: Sestavit
        run: dotnet build Plan.sln -c Release --no-restore -p:Version=${{ steps.verze.outputs.verze }}

      - name: Spustit testy
        run: dotnet test Plan.Tests/Plan.Tests.csproj -c Release --no-build --verbosity normal

      # Self-contained single-file: uživatel nemusí instalovat .NET runtime.
      - name: Publikovat
        run: >
          dotnet publish Plan/Plan.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.verze.outputs.verze }}
          -o publish

      # Inno Setup je na windows runnerech předinstalovaný jen občas, proto raději
      # explicitně — chocolatey je tam vždy a instalace trvá pár sekund.
      - name: Nainstalovat Inno Setup
        run: choco install innosetup --no-progress -y

      # Pozor na zápis proměnné: $env:ProgramFiles(x86) se v PowerShellu neparsuje,
      # závorky je nutné uzavřít do ${...}.
      - name: Sestavit instalátor
        shell: pwsh
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ steps.verze.outputs.verze }}
          /DSourceExe=..\publish\Plan.exe
          installer\Plan.iss

      - name: Pojmenovat přenosnou verzi podle verze
        shell: pwsh
        run: Move-Item publish/Plan.exe "publish/Plan-${{ steps.verze.outputs.verze }}-win-x64.exe"

      - name: Vytvořit GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Plan ${{ steps.verze.outputs.verze }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            installer-output/Plan-${{ steps.verze.outputs.verze }}-setup.exe
            publish/Plan-${{ steps.verze.outputs.verze }}-win-x64.exe
          body: |
            Verze **${{ steps.verze.outputs.verze }}** aplikace Plan pro Windows (64bit).

            **Doporučeně:** stáhněte `Plan-${{ steps.verze.outputs.verze }}-setup.exe`
            a spusťte. Instaluje se jen pro přihlášeného uživatele, takže se neptá na
            práva správce, a vytvoří zástupce v nabídce Start i na ploše. Aktualizace
            stačí nainstalovat přes stávající verzi — zástupce na ploše zůstane na místě.

            **Bez instalace:** `Plan-${{ steps.verze.outputs.verze }}-win-x64.exe` je
            přenosná varianta, kterou stačí spustit.

            Data v obou případech žijí v `%AppData%\Plan\plan.db` mimo aplikaci,
            takže o ně aktualizace ani odinstalace nepřijde.
